  <main class="content">
    <h1 class="title">Installing FixtureDocs</h1>
    <p class="body-text">
      Install FixtureDocs with pip:
    </p>
    <pre class="code-block">pip install fixturedocs</pre>
    <p class="body-text">
      Verify the installation by checking the version:
    </p>
    <pre class="code-block">fixturedocs --version</pre>
    <p class="body-text">
      FixtureDocs requires Python 3.11 or newer and stores its configuration
      in <code>~/.config/fixturedocs.toml</code>.
    </p>
