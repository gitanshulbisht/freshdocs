name: FreshDocs refresh

on:
  schedule:
    - cron: "15 3 * * *"   # nightly
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Set up Bright Data CLI
        run: npx -y -p @brightdata/cli bdata --version

      - name: Refresh (scrape, validate, diff, embed)
        env:
          BRIGHT_DATA_API_TOKEN: ${{ secrets.BRIGHT_DATA_API_TOKEN }}
          BRIGHT_DATA_COLLECTOR_IDS: ${{ secrets.BRIGHT_DATA_COLLECTOR_IDS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FRESHDOCS_DATA_DIR: data
        run: |
          python -m freshdocs.cli refresh --heal || echo "REFRESH_HAD_FAILURES=1" >> "$GITHUB_ENV"

      - name: Upload refresh artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshdocs-outputs
          path: data/outputs/
